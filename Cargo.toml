[package]
name = "flux"
version = "0.1.0"
edition = "2024"
description = "A cross-platform async networking utility"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
socket2 = "0.6"
